services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME:-agente_curriculums}
      MYSQL_USER: ${DATABASE_USER:-agente_user}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_root_me}
    ports: ["${DATABASE_PORT:-3306}:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-change_root_me}"]
      interval: 10s
      timeout: 5s
      retries: 10
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes: ["ollama_data:/root/.ollama"]
    ports: ["11434:11434"]
    cpus: 4.0
    mem_limit: 6g
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
  ollama-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-gemma4:e2b-it-qat}"]
    depends_on:
      ollama:
        condition: service_healthy
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes: ["clamav_data:/var/lib/clamav"]
  worker:
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_HOST: mysql
      OLLAMA_BASE_URL: http://ollama:11434
      MEDIA_ROOT: /app/media
      ANALYSIS_BATCH_SIZE: 2
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py automatizar_pipeline --interval ${ANALYSIS_INTERVAL_SECONDS:-900}"]
    volumes: ["./media:/app/media"]
    depends_on:
      mysql:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
  web:
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_HOST: mysql
      OLLAMA_BASE_URL: http://ollama:11434
      MEDIA_ROOT: /app/media
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,.trycloudflare.com}"
      PDF_ANTIVIRUS_ENABLED: "${PDF_ANTIVIRUS_ENABLED:-true}"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120"]
    ports: ["${WEB_PORT:-8001}:8000"]
    volumes: ["./media:/app/media"]
    depends_on:
      mysql:
        condition: service_healthy
      clamav:
        condition: service_started
  webhook-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/whatsapp-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_started
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://webhook-gateway:8080"]
    depends_on:
      webhook-gateway:
        condition: service_started
volumes:
  mysql_data:
  ollama_data:
  clamav_data:
