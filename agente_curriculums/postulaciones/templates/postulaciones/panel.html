{% load static %}
<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Postulaciones · RH</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f4f7f8;color:#17202a}.wrap{max-width:1180px;margin:30px auto;padding:0 18px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}a{color:#126e82}table{width:100%;border-collapse:collapse;background:white;border-radius:12px;overflow:hidden}th,td{text-align:left;padding:13px;border-bottom:1px solid #e5eaed}th{background:#eaf1f3}.filters{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}input,select,button{padding:10px;border:1px solid #ccd5db;border-radius:7px;font:inherit}button{cursor:pointer;background:white}.muted{color:#60717b}</style></head>
<body><main class="wrap"><header><div><p class="muted">RH · POSTULACIONES</p><h1>Candidatos recibidos</h1></div><a href="/">Volver al workspace</a></header><div class="filters"><input id="search" placeholder="Buscar nombre, correo o teléfono"><select id="status"><option value="">Todos los estados</option><option value="RECIBIDO">Recibido</option><option value="EN_REVISION">En revisión</option><option value="CONTACTADO">Contactado</option><option value="DESCARTADO">Descartado</option></select><button id="refresh">Actualizar</button></div><p id="message" class="muted"></p><table><thead><tr><th>Candidato</th><th>Vacante</th><th>Contacto</th><th>Estado</th><th>Fecha</th><th>CV</th></tr></thead><tbody id="rows"></tbody></table></main><script>
const rows=document.getElementById('rows'),msg=document.getElementById('message');function csrf(){return decodeURIComponent(document.cookie.split('; ').find(x=>x.startsWith('csrftoken='))?.split('=').slice(1).join('=')||'')}async function load(){msg.textContent='Cargando…';const q=new URLSearchParams();if(search.value)q.set('search',search.value);if(status.value)q.set('estado',status.value);const r=await fetch('/api/postulaciones/?'+q);const d=await r.json();if(!r.ok){msg.textContent=d.detail||'No autorizado';return}rows.innerHTML=(d.results||d).map(x=>`<tr><td><strong>${esc(x.candidato.nombre_completo)}</strong></td><td>${esc(x.vacante_titulo||'')}</td><td>${esc(x.candidato.telefono_whatsapp)}<br><a href="mailto:${esc(x.candidato.correo)}">${esc(x.candidato.correo)}</a></td><td><select data-id="${x.id}" class="state"><option ${x.estado==='RECIBIDO'?'selected':''} value="RECIBIDO">Recibido</option><option ${x.estado==='EN_REVISION'?'selected':''} value="EN_REVISION">En revisión</option><option ${x.estado==='CONTACTADO'?'selected':''} value="CONTACTADO">Contactado</option><option ${x.estado==='DESCARTADO'?'selected':''} value="DESCARTADO">Descartado</option></select></td><td>${new Date(x.created_at).toLocaleString('es-MX')}</td><td><a href="${x.archivo_url}" target="_blank" rel="noopener">Descargar</a></td></tr>`).join('');msg.textContent=`${d.count??(d.results||d).length} postulaciones`;document.querySelectorAll('.state').forEach(s=>s.onchange=async()=>{const r=await fetch('/api/postulaciones/'+s.dataset.id+'/',{method:'PATCH',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({estado:s.value})});if(!r.ok){msg.textContent='No se pudo actualizar el estado';await load()}})}function esc(v=''){const d=document.createElement('div');d.textContent=v;return d.innerHTML}document.getElementById('refresh').onclick=load;document.getElementById('status').onchange=load;document.getElementById('search').onkeydown=e=>{if(e.key==='Enter')load()};load();
</script></body></html>
